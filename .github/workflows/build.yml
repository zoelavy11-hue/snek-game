name: Build Windows EXE

on: 
    push:
        workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        defaults:
            run:
                working-directory: game
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            - run: pip install pygame pyinstaller
            - run: pyinstaller --onefile --windowed --name snekgame --add-data "imgs;imgs" snekgame.py
            - uses: actions/upload-artifact@v4
              with:
                name: snekgame-windows
                path: game/dist/snekgame.exe